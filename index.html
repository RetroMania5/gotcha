<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gotcha</title>
<!-- Home-screen app. `apple-mobile-web-app-capable` is what makes it launch
     without Safari's chrome, and the touch icon is what iOS puts on the home
     screen — it ignores the web manifest's icons for that. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gotcha">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="css/ios.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="linen">

<div class="phone">

  <div class="navbar">
    <div class="left" id="navLeft">
      <button class="btn small grey" id="soundBtn" title="Sound">🔊</button>
    </div>
    <div class="title" id="navTitle">Play</div>
    <div class="right">
      <span class="coins"><span class="c">◉</span><span id="coinCount">0</span></span>
    </div>
  </div>

  <!-- ── play ─────────────────────────────────────────────────────────── -->
  <div class="screen play" id="screenPlay">
    <div class="stage">
      <canvas id="game"></canvas>

      <div class="overlay" id="ovReady">
        <div class="tapcard">
          <b>Tap to fly</b>
          <span id="rateLine">10 coins a pipe</span>
        </div>
      </div>

      <div class="overlay" id="ovDead" style="display:none">
        <div class="deadcard">
          <h2>Nice run</h2>
          <div class="deadstats">
            <div><b id="dPipes">0</b><span>pipes</span></div>
            <div><b id="dEarned">0</b><span>earned</span></div>
            <div><b id="dBest">0</b><span>best</span></div>
          </div>
          <button class="btn wide" id="btnAgain">Again</button>
          <button class="btn grey wide" id="btnToShop" style="margin-top:8px">Spend it</button>
        </div>
      </div>

      <div class="hud" id="hud">0</div>

      <!-- The three items, before you start. Tap to arm. -->
      <!-- The hint is static; the row of buttons is built by renderItemBar(). -->
      <div class="item-wrap" id="itemWrap">
        <div class="item-hint">One per round</div>
        <div class="item-bar" id="itemBar"></div>
      </div>
    </div>
  </div>

  <!-- ── shop ─────────────────────────────────────────────────────────── -->
  <div class="screen hidden" id="screenShop">
    <div class="group">
      <h3>Upgrade</h3>
      <div class="cells" id="upgradeCell"></div>
    </div>
    <div class="group">
      <h3>Items</h3>
      <div class="cells" id="itemCell"></div>
    </div>
    <div class="group">
      <h3>Machines</h3>
      <div class="cells" id="machines"></div>
    </div>
    <div class="group">
      <h3>Odds</h3>
      <div class="cells" id="oddsCell"></div>
    </div>
  </div>

  <!-- ── collection ───────────────────────────────────────────────────── -->
  <div class="screen hidden" id="screenBag">
    <div class="group">
      <h3 id="bagTotals">Collection</h3>
      <div class="cells">
        <div class="cell"><div class="grow">
          <div class="bar"><span id="bagBar"></span></div>
        </div></div>
        <div class="cell">
          <div class="grow"><small>Tap a card you have more than one of to sell a spare.</small></div>
          <button class="btn small" id="sellAllBtn">No spares to sell</button>
        </div>
      </div>
    </div>
    <div id="bagSets"></div>
  </div>

  <!-- ── tabs ─────────────────────────────────────────────────────────── -->
  <div class="tabbar">
    <button class="tab" id="tabShop"><span class="ico">🛒</span>Shop</button>
    <button class="tab on" id="tabPlay"><span class="ico">🐤</span>Play</button>
    <button class="tab" id="tabBag"><span class="ico">🎒</span>Collection</button>
  </div>
</div>

<!-- Sparks and floating coins land here, above everything and never in the
     way of a tap. -->
<div class="burst-layer" id="burstLayer"></div>

<!-- The capsule flies here, above everything. -->
<div class="capsule-stage" id="capsuleStage"></div>

<!-- ── the pull result ────────────────────────────────────────────────── -->
<div class="modal-back" id="pullBack">
  <div class="modal" id="pullModal">
    <p id="pullCount" class="pull-count"></p>
    <h2 id="pullTier">Common</h2>
    <p id="pullSet">Sunburst</p>
    <div class="pullart"><img id="pullImg" alt=""></div>
    <p id="pullDupe" style="margin:10px 0 0"></p>
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="btn grey" id="pullDone" style="flex:1">Done</button>
      <button class="btn" id="pullAgain" style="flex:1">Again</button>
    </div>
  </div>
</div>

<script src="assets/manifest.js"></script>
<script src="js/sfx.js"></script>
<script src="js/state.js"></script>
<script src="js/flappy.js"></script>
<script src="js/app.js"></script>
</body>
</html>
